services:
  db:
    image: postgres:16-alpine
    container_name: image_vault_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: image_vault
      POSTGRES_USER: vault_user
      POSTGRES_PASSWORD: vault_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_user -d image_vault"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
